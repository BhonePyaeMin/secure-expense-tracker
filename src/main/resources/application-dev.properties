# "dev" profile, for working on the app: ./mvnw spring-boot:run -Pdev
# Same database as the default profile (./data/expenses).

# H2 web console at http://localhost:8080/h2-console (sign in to the app first).
# Connect with JDBC URL jdbc:h2:file:./data/expenses, user sa, empty password.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Pick up template changes without restarting
spring.thymeleaf.cache=false
