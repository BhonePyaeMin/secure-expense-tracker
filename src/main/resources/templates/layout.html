<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Expense Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/expenses}">Expense Tracker</a>
        <nav th:if="${currentUsername != null}">
            <a th:href="@{/expenses}">Expenses</a>
            <a th:href="@{/expenses/new}">Add expense</a>
            <a th:href="@{/summary}">Summary</a>
            <a th:href="@{/activity}">Activity</a>
        </nav>
        <div class="user-menu" th:if="${currentUsername != null}">
            <span class="muted" th:text="${currentUsername}">alice</span>
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="link">Sign out</button>
            </form>
        </div>
    </div>
</header>

<main th:replace="${content}">
    Page content goes here.
</main>

<footer class="container site-footer muted">
    Amounts in <span th:text="${@money.code}">THB</span>
</footer>
</body>
</html>
