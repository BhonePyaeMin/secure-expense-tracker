<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Expense · Expense Tracker</title>
</head>
<body>
<main class="container narrow">
    <h1 th:text="${expenseId == null} ? 'Add expense' : 'Edit expense'">Add expense</h1>

    <form class="quick-add" method="get" th:action="@{/expenses/new}" th:if="${expenseId == null}">
        <label for="quick">Quick add</label>
        <div class="quick-row">
            <input type="text" id="quick" name="quick" th:value="${quickText}" maxlength="200"
                   placeholder="Try: lunch 85 baht yesterday">
            <button type="submit" class="button secondary">Fill in</button>
        </div>
        <p class="hint" th:if="${quickText == null}">Type it the way you'd say it. This fills in the form below; nothing is saved until you press Save.</p>
        <p class="flash" th:if="${quickText != null}">Filled in from your text. Check the details, then save.</p>
    </form>

    <form class="form" method="post" th:object="${expenseForm}" th:data-suggest-url="@{/expenses/suggest-category}"
          th:action="${expenseId == null} ? @{/expenses} : @{/expenses/{id}(id=${expenseId})}">

        <div class="field">
            <label for="title">Title</label>
            <input type="text" th:field="*{title}" th:errorclass="field-error" maxlength="100" required>
            <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error</p>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="amount" th:text="|Amount (${@money.symbol})|">Amount</label>
                <input type="number" th:field="*{amount}" th:errorclass="field-error" step="0.01" min="0.01" inputmode="decimal" required>
                <p class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">Error</p>
            </div>

            <div class="field">
                <label for="date">Date</label>
                <input type="date" th:field="*{date}" th:errorclass="field-error" required>
                <p class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">Error</p>
            </div>
        </div>

        <div class="field">
            <label for="category">Category</label>
            <select th:field="*{category}" th:errorclass="field-error" required>
                <option value="">Choose a category</option>
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}">Food</option>
            </select>
            <p class="hint" id="category-hint" aria-live="polite"></p>
            <p class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Error</p>
        </div>

        <div class="field">
            <label for="note">Note <span class="muted">(optional)</span></label>
            <textarea th:field="*{note}" th:errorclass="field-error" rows="3" maxlength="255"></textarea>
            <p class="error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}">Error</p>
        </div>

        <div class="form-actions">
            <button type="submit" class="button">Save</button>
            <a th:href="@{/expenses}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
