spring.application.name=expense-tracker

# H2 file database, stored in ./data/expenses.mv.db (relative to where the app is started)
spring.datasource.url=jdbc:h2:file:./data/expenses;AUTO_SERVER=FALSE
spring.datasource.username=sa
# No password is stored in this file: set DB_PASSWORD in the environment if the database has one
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update

# The H2 web console is off by default; the "dev" profile turns it on (application-dev.properties)
spring.h2.console.enabled=false
spring.jpa.open-in-view=false

# Time zone for JSON dates; the app's Clock and JVM default use the same zone (see TimeConfig)
spring.jackson.time-zone=Asia/Bangkok

# Bind and render LocalDate as yyyy-MM-dd (what <input type="date"> uses)
spring.mvc.format.date=iso

spring.thymeleaf.cache=true

# Track sessions (used by flash messages) with a cookie only, never ;jsessionid in URLs
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.same-site=lax

# Currency shown in the UI. The symbol is a unicode escape because .properties files are read as ISO-8859-1.
app.currency.code=THB
app.currency.symbol=\u0E3F

# Account lockout: lock after this many wrong passwords in a row, for this long
app.security.max-failed-logins=5
app.security.lockout-duration=15m

# CSV import: small files only
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Error pages (templates/error/404.html, 500.html, error.html): never send stack traces,
# exception names or internal messages to the browser
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Logging: INFO, to the console and ./logs/app.log. Files roll at 2 MB and old ones are deleted
# once they pass 8 MB, so logs never take more than about 10 MB. The app never logs amounts,
# notes or passwords (LoggingPrivacyTest checks this).
logging.level.root=INFO
logging.file.name=./logs/app.log
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.total-size-cap=8MB
logging.logback.rollingpolicy.max-history=14

# Keep memory and startup cost low
spring.main.lazy-initialization=true
server.tomcat.threads.max=20
