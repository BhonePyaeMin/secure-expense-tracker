spring.application.name=expense-tracker

# H2 file database, stored in ./data/expenses.mv.db (relative to where the app is started)
spring.datasource.url=jdbc:h2:file:./data/expenses;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Bind and render LocalDate as yyyy-MM-dd (what <input type="date"> uses)
spring.mvc.format.date=iso

spring.thymeleaf.cache=true

# Track sessions (used by flash messages) with a cookie only, never ;jsessionid in URLs
server.servlet.session.tracking-modes=cookie

# Keep memory and startup cost low
spring.main.lazy-initialization=true
server.tomcat.threads.max=20
